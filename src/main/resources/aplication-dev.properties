spring.datasource.url=jdbc:mysql://localhost:3306/queueup?useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Logs
logging.level.queueup.api=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Seed com senha fixa em dev
queueup.seed.super-admin.email=admin@queueup.local
queueup.seed.super-admin.password=admin123