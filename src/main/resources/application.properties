spring.application.name=gestorDeFila

# Jackson / timezone
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Seed
queueup.seed.super-admin.email=${SEED_ADMIN_EMAIL:admin@queueup.local}
queueup.seed.super-admin.password=${SEED_ADMIN_PASSWORD:}

# Profile default
spring.profiles.default=dev
spring.datasource.username=root
spring.datasource.password=12344321
spring.flyway.locations=classpath:db/migration
server.error.include-stacktrace=always

api.security.token.secret=my-secret-key