spring.datasource.url=jdbc:h2:mem:queueup;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

queueup.jwt.secret=test-secret-key-with-at-least-32-chars
queueup.jwt.expiration-minutes=60
queueup.seed.super-admin.email=admin@test.local
queueup.seed.super-admin.password=test123